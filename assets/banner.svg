<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.25}}@keyframes float{0%{transform:translateY(0) translateX(0)}}@keyframes floatRev{0%{transform:translateY(0) translateX(0)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:500;font-size:18px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.pulse-circle{animation:pulse 4s ease-in-out infinite alternate}.float-slow{animation:float 6s ease-in-out infinite alternate}.float-reverse{animation:floatRev 7s ease-in-out infinite alternate}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g class="pulse-circle" style="transform-origin:200px 100px"><circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity=".15"/></g><g class="pulse-circle" style="transform-origin:1000px 250px"><circle cx="1000" cy="250" r="160" fill="#a855f7" filter="url(#glow)" opacity=".18"/></g><g stroke="#334155" stroke-width="1" opacity=".2"><lin