<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .float-slow {
      animation: float 6s ease-in-out infinite alternate;
    }
    .float-reverse {
      animation: floatRev 7s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes floatRev {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(12px) translateX(-6px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glow Orbs (Strictly in Background) -->
  <g class="pulse-circle" style="transform-origin: 200px 100px;">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.15" />
  </g>
  <g class="pulse-circle" style="transform-origin: 1000px 250px;">
    <circle cx="1000" cy="250" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.18" />
  </g>

  <!-- Background Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Dynamic Floating Feature Cards on the Right (Background / Side decoration) -->
  <g class="float-slow" style="transform-origin: 960px 110px;">
    <g transform="translate(860, 50)">
      <rect width="260" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="24" y="32" font-family="sans-serif" font-size="20">🏢</text>
      <text x="56" y="30" class="badge-text" fill="#38bdf8" font-weight="700">Enterprise B2B Portals</text>
      <text x="56" y="50" font-family="sans-serif" font-size="12" fill="#64748b">Quotes, Catalogs &amp; ERP Sync</text>
    </g>
  </g>

  <g class="float-reverse" style="transform-origin: 920px 220px;">
    <g transform="translate(820, 150)">
      <rect width="280" height="70" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="24" y="32" font-family="sans-serif" font-size="20">⚡</text>
      <text x="56" y="30" class="badge-text" fill="#818cf8" font-weight="700">Headless &amp; Composable</text>
      <text x="56" y="50" font-family="sans-serif" font-size="12" fill="#64748b">MACH, REST &amp; GraphQL APIs</text>
    </g>
  </g>

  <g class="float-slow" style="transform-origin: 980px 290px;">
    <g transform="translate(880, 250)">
      <rect width="250" height="65" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="24" y="30" font-family="sans-serif" font-size="20">🔓</text>
      <text x="56" y="28" class="badge-text" fill="#c084fc" font-weight="700">Open-Source Engines</text>
      <text x="56" y="47" font-family="sans-serif" font-size="12" fill="#64748b">Self-Hosted &amp; Scalable</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Never hidden) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill -->
    <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="16" y="20" class="badge-text" fill="#38bdf8">🛒 CURATED ARCHITECTURE DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">
      Awesome B2B E-Commerce
    </text>

    <!-- Title Accent Gradient Underline -->
    <rect x="0" y="96" width="510" height="4" rx="2" fill="url(#primaryGrad)" />

    <!-- Subtitle -->
    <text x="0" y="135" class="subtitle">
      Enterprise SaaS &amp; Open-Source Wholesale Commerce Frameworks
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 165)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#334155" />
        <text x="16" y="22" class="badge-text">💼 Company Accts</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#334155" />
        <text x="16" y="22" class="badge-text">📊 Tiered Pricing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect width="135" height="34" rx="17" fill="#1e293b" stroke="#334155" />
        <text x="16" y="22" class="badge-text">🔄 ERP Read/Sync</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(455, 0)">
        <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" />
        <text x="16" y="22" class="badge-text">🌐 Multi-Vendor</text>
      </g>
    </g>
  </g>
</svg>
